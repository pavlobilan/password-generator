<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Генератор паролів</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F55C8'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3E*%23%3C/text%3E%3C/svg%3E">
<style>
:root{
  --page:#E9EDF1; --panel:#FFFFFF; --well:#F4F6F8; --ink:#17212B; --mute:#5E6B78; --line:#D3DAE1;
  --accent:#2F55C8; --accent-ink:#FFFFFF; --digit:#0E7A6A; --sym:#B4441C;
  --mono:"Cascadia Mono","JetBrains Mono","SF Mono",Consolas,"DejaVu Sans Mono",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
:root{color-scheme:light;--gap:72px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --page:#0F151B; --panel:#18212A; --well:#121A21; --ink:#E4EAF0; --mute:#8D9AA7; --line:#2A3540;
  --accent:#7C9BFF; --accent-ink:#0F151B; --digit:#46C6B2; --sym:#F08A5D;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --page:#0F151B; --panel:#18212A; --well:#121A21; --ink:#E4EAF0; --mute:#8D9AA7; --line:#2A3540;
  --accent:#7C9BFF; --accent-ink:#0F151B; --digit:#46C6B2; --sym:#F08A5D;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:0 auto;padding:max(24px, calc(50vh - 52px)) 16px 56px;padding-top:max(24px, calc(50dvh - 52px))}
.head{position:fixed;top:14px;right:14px;z-index:3}
h1{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.theme{display:grid;place-items:center;width:32px;height:32px;padding:0;border:0;border-radius:8px;background:transparent;
  color:var(--mute);opacity:.55;cursor:pointer}
.theme:hover,.theme:focus-visible{opacity:1;background:var(--well)}
.theme svg{display:none}
:root:not([data-theme]) .theme .t-sys,:root[data-theme="light"] .theme .t-light,:root[data-theme="dark"] .theme .t-dark{display:block}

.stack{width:fit-content;max-width:100%;margin:0 auto}
.cardwrap{position:relative;--gap:72px}
.toast{position:absolute;left:50%;top:calc(100% + var(--gap) / 2);z-index:2;padding:14px 32px;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);color:var(--ink);font:500 19px var(--sans);white-space:nowrap;
  box-shadow:0 6px 20px rgba(23,33,43,.14);opacity:0;transform:translate(-50%,calc(-50% - 6px));pointer-events:none}
.toast.show{opacity:.95;transform:translate(-50%,-50%)}
@media (prefers-reduced-motion:no-preference){
  .toast{transition:opacity .9s ease,transform .9s ease}
  .toast.show{transition:opacity .18s ease,transform .18s ease}
}
.out{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:14px;padding:24px 20px 24px 30px}
.pw{flex:0 1 auto;width:calc(26ch + 1em);min-width:0;font:500 30px/1.3 var(--mono);letter-spacing:.04em;word-break:break-all;cursor:copy;-webkit-user-select:all;user-select:all}
.pw .d{color:var(--digit)} .pw .s{color:var(--sym)}
.ibtn{flex:none;display:grid;place-items:center;width:56px;height:56px;padding:0;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);color:var(--mute);cursor:pointer}
.ibtn svg{width:26px;height:26px}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn:active svg{transform:scale(.9)}
.ibtn:disabled{opacity:.45;cursor:default}
.ibtn .i-ok{display:none}
.ibtn.done{background:var(--digit);border-color:var(--digit);color:var(--panel)}
.ibtn.done .i-ok{display:block} .ibtn.done .i-copy{display:none}
.row .ibtn+.ibtn{margin-left:-4px}
.err{margin:0;padding:0 20px 14px;color:var(--sym);font-size:14px}
.err:empty{display:none}

.opts{margin:var(--gap) 0 0;padding:0 30px;display:grid;grid-template-columns:150px 1fr;gap:18px 16px;align-items:center}
.lbl{color:var(--mute);font-size:14px}
.num{display:flex;align-items:center;gap:16px}
input[type=number]{width:72px;padding:6px 8px;text-align:center;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--ink);font:500 15px var(--mono)}
input[type=range]{width:220px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;min-width:64px;padding:6px 12px;text-align:center;border:1px solid var(--line);
  border-radius:8px;background:var(--well);color:var(--mute);font:500 14px var(--mono);cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:inline-flex;align-items:flex-start;gap:8px;cursor:pointer;vertical-align:top}
.check input{margin:4px 0 0;accent-color:var(--accent)}
.check small{display:block;color:var(--mute);font-size:12.5px}
.check code{font-family:var(--mono)}
input.text{width:260px;max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  color:var(--ink);font:15px var(--mono)}
.reveal{grid-column:1/-1;display:grid;grid-template-rows:0fr;opacity:0;margin-top:-18px}
.reveal.on{grid-template-rows:1fr;opacity:1;margin-top:0}
.reveal>.inner{min-height:0;overflow:hidden;display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;padding:3px 0;margin:-3px 0}
.ready .reveal{transition:grid-template-rows .28s ease,opacity .22s ease,margin-top .28s ease}
@media (max-width:560px){
  main{padding-top:max(20px, calc(50vh - 60px));padding-top:max(20px, calc(50dvh - 60px))}
  .row{padding:16px 12px 16px 18px;gap:10px}
  .ibtn{width:48px;height:48px;border-radius:12px}
  .ibtn svg{width:22px;height:22px}
  .toast{font-size:17px;padding:12px 26px}
  .cardwrap,.opts{--gap:64px}
  .pw{font-size:21px}
  .opts{grid-template-columns:1fr;gap:6px;padding:0 18px}
  .opts>div{margin-bottom:12px}
  .num input[type=range]{flex:1;width:auto}
  input.text{width:100%}
  .reveal{margin-top:-6px}
  .reveal>.inner{grid-template-columns:1fr;gap:6px}
}
@media (prefers-reduced-motion:no-preference){.ibtn{transition:background .15s,color .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){.ready .reveal{transition:none}}
</style></head><body><main>
<div class="head"><h1>Генератор паролів</h1>
  <button type="button" class="theme" id="theme" title="Тема: системна" aria-label="Тема: системна">
    <svg class="t-sys" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    <svg class="t-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="t-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button></div>

<div class="stack">
<div class="cardwrap">
<section class="out" aria-live="polite">
  <div class="row">
    <span class="pw" id="pw" title="Натисніть, щоб скопіювати"></span>
    <button type="button" class="ibtn" id="gen" title="Згенерувати новий" aria-label="Згенерувати новий"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
    <button type="button" class="ibtn" id="copy" title="Копіювати" aria-label="Копіювати"><svg class="i-copy" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><svg class="i-ok" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
  <p class="err" id="err"></p>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<form id="f" class="opts" autocomplete="off" onsubmit="return false">
  <label class="lbl" for="len">Довжина</label>
  <div class="num"><input type="number" name="len" id="len" min="4" max="128" value="25">
    <input type="range" id="lenr" min="4" max="64" value="25" aria-label="Довжина"></div>
  <span class="lbl">Символи</span>
  <div class="chips">
    <label class="chip"><input type="checkbox" name="upper" checked><span>A–Z</span></label>
    <label class="chip"><input type="checkbox" name="lower" checked><span>a–z</span></label>
    <label class="chip"><input type="checkbox" name="digits" checked><span>0–9</span></label>
    <label class="chip"><input type="checkbox" name="special"><span>!#%</span></label>
  </div>
  <span class="lbl">Правила</span>
  <div>
    <label class="check"><input type="checkbox" name="ambiguous" checked>
      <span>Читабельний набір<small>Без <code>I O Q l o 0 1</code></small></span></label>
  </div>
  <div class="reveal" id="symrow"><div class="inner">
    <label class="lbl" for="symbols">Спецсимволи</label>
    <div><input class="text" type="text" name="symbols" id="symbols" value="!#%+@:=?*" spellcheck="false"></div>
  </div></div>
</form>
</div>
</main>
<script>
(function(){
  "use strict";
  var SETS = {
    upper:  ["ABCDEFGHIJKLMNOPQRSTUVWXY", "ABCDEFGHJKLMNPRSTUVWXY"],
    lower:  ["abcdefghijklmnopqrstuvwxy", "abcdefghijkmnpqrstuvwxy"],
    digits: ["0123456789", "23456789"]
  };
  var MIN_LEN = 4, MAX_LEN = 128, DEF_LEN = 25, DEF_SYMBOLS = "!#%+@:=?*";
  var FLAGS = ["upper","lower","digits","special","ambiguous"];
  var DEF_FLAGS = {upper:true, lower:true, digits:true, special:false, ambiguous:true};

  var form = document.getElementById("f"), pwEl = document.getElementById("pw"),
      errEl = document.getElementById("err"), copyBtn = document.getElementById("copy"),
      lenN = document.getElementById("len"), lenR = document.getElementById("lenr"),
      current = "";

  // Рівномірне випадкове число 0..n-1 з CSPRNG (без modulo bias)
  function randInt(n){
    var buf = new Uint32Array(1), limit = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }
  function pick(s){ return s[randInt(s.length)]; }
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){ var j = randInt(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function uniq(s){ return Array.from(new Set(Array.from(s))).join(""); }

  function readOpts(){
    var o = {};
    FLAGS.forEach(function(k){ o[k] = form.elements[k].checked; });
    var n = parseInt(lenN.value, 10);
    o.len = isNaN(n) ? DEF_LEN : Math.max(MIN_LEN, Math.min(MAX_LEN, n));
    o.symbols = uniq(Array.from(form.elements.symbols.value).filter(function(c){
      return /\S/.test(c) && !/[A-Za-z0-9]/.test(c); }).join(""));
    return o;
  }
  function classes(o){
    var r = o.ambiguous ? 1 : 0, out = [];
    [["upper", SETS.upper[r]], ["lower", SETS.lower[r]], ["digits", SETS.digits[r]], ["special", o.symbols]]
      .forEach(function(x){ if (o[x[0]] && x[1]) out.push(x[1]); });
    return out;
  }
  // Кожен увімкнений тип символів — хоча б раз
  function generate(o){
    var cls = classes(o);
    if (!cls.length) return null;
    var alpha = uniq(cls.join("")), chars = [];
    if (cls.length <= o.len) cls.forEach(function(c){ chars.push(pick(c)); });
    while (chars.length < o.len) chars.push(pick(alpha));
    return shuffle(chars).join("");
  }

  function paint(pw){
    pwEl.textContent = "";
    Array.from(pw).forEach(function(c){
      if (/[A-Za-z]/.test(c)) { pwEl.appendChild(document.createTextNode(c)); return; }
      var s = document.createElement("span"); s.className = /[0-9]/.test(c) ? "d" : "s";
      s.textContent = c; pwEl.appendChild(s);
    });
  }
  function syncUrl(o){
    var q = new URLSearchParams();
    q.set("len", o.len);
    FLAGS.forEach(function(k){ q.set(k, o[k] ? "on" : "off"); });
    q.set("symbols", o.symbols);
    try { history.replaceState(null, "", "?" + q.toString()); } catch (_) {}
  }
  function refresh(){
    var o = readOpts(), pw = generate(o);
    if (!pw){
      current = ""; pwEl.textContent = "";
      errEl.textContent = "Увімкніть хоча б один набір символів.";
      copyBtn.disabled = true; return;
    }
    current = pw; paint(pw);
    errEl.textContent = ""; copyBtn.disabled = false;
    syncUrl(o);
  }

  // Параметри з URL: len, upper, lower, digits, special, ambiguous, symbols
  function applyUrl(){
    var q = new URLSearchParams(location.search);
    if (q.has("len")) lenN.value = q.get("len");
    FLAGS.forEach(function(k){ if (q.has(k)) form.elements[k].checked = /^(on|1|true|yes)$/i.test(q.get(k)); });
    if (q.has("symbols") && q.get("symbols").trim()) form.elements.symbols.value = q.get("symbols");
    var v = Math.max(MIN_LEN, Math.min(MAX_LEN, parseInt(lenN.value, 10) || DEF_LEN));
    lenN.value = v; lenR.value = Math.min(64, v);
  }

  // Копіювання — лише plain text
  function writePlain(text){
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta); return Promise.resolve();
  }
  function copyNow(){
    if (!current) return;
    writePlain(current).then(function(){
      copyBtn.classList.add("done"); copyBtn.title = "Скопійовано";
      clearTimeout(copyBtn._t);
      copyBtn._t = setTimeout(function(){ copyBtn.classList.remove("done"); copyBtn.title = "Копіювати"; }, 1300);
      toast.textContent = "Скопійовано"; toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(function(){ toast.classList.remove("show"); }, 1200);
    });
  }
  var toast = document.getElementById("toast");
  copyBtn.addEventListener("click", copyNow);
  // Одинарний і подвійний клік: виділити весь пароль і скопіювати
  function selectAll(){
    var sel = window.getSelection(), r = document.createRange();
    r.selectNodeContents(pwEl); sel.removeAllRanges(); sel.addRange(r);
  }
  pwEl.addEventListener("mousedown", function(e){ if (e.detail > 1) e.preventDefault(); });
  pwEl.addEventListener("click", function(){ if (!current) return; selectAll(); copyNow(); });
  pwEl.addEventListener("dblclick", function(e){ e.preventDefault(); if (!current) return; selectAll(); copyNow(); });
  document.addEventListener("copy", function(e){
    var s = String(document.getSelection());
    if (s){ e.clipboardData.setData("text/plain", s); e.preventDefault(); }
  });

  var timer;
  lenR.addEventListener("input", function(){ lenN.value = lenR.value; });
  lenN.addEventListener("input", function(){ lenR.value = Math.min(64, lenN.value || 0); });
  form.addEventListener("input", function(){ clearTimeout(timer); timer = setTimeout(refresh, 120); });
  var genBtn = document.getElementById("gen"),
      calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  genBtn.addEventListener("click", function(){
    refresh();
    var svg = genBtn.querySelector("svg");
    if (!calm && svg.animate) svg.animate([{transform:"rotate(0)"},{transform:"rotate(360deg)"}], {duration:350, easing:"ease"});
  });

  var symRow = document.getElementById("symrow"), special = form.elements.special;
  function toggleSymbols(){
    symRow.classList.toggle("on", special.checked);
    symRow.inert = !special.checked;
    symRow.setAttribute("aria-hidden", special.checked ? "false" : "true");
  }
  special.addEventListener("change", toggleSymbols);

  // Тема: системна → світла → темна
  var themeBtn = document.getElementById("theme"), root = document.documentElement,
      ORDER = ["system", "light", "dark"], NAMES = {system:"системна", light:"світла", dark:"темна"};
  function themeLabel(){
    var t = root.getAttribute("data-theme") || "system", l = "Тема: " + NAMES[t];
    themeBtn.title = l; themeBtn.setAttribute("aria-label", l);
  }
  themeBtn.addEventListener("click", function(){
    var cur = root.getAttribute("data-theme") || "system",
        next = ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length];
    if (next === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", next);
    try { if (next === "system") localStorage.removeItem("theme"); else localStorage.setItem("theme", next); } catch (_) {}
    themeLabel();
  });
  themeLabel();

  applyUrl();
  toggleSymbols();
  refresh();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.body.classList.add("ready"); }); });
})();
</script></body></html>
